    <path d="M-150 -40 C-150 -100 -110 -120 0 -120 C110 -120 150 -100 150 -40
             L150 50 C150 110 110 126 20 126 L-30 126 L-82 168 L-74 124
             C-126 116 -150 96 -150 50 Z" fill="#FFFFFF"/>
    <!-- Herz wie auf dem Halstuch -->
    <path d="M0 78 C-60 36 -84 6 -84 -24 C-84 -52 -62 -70 -40 -70
             C-22 -70 -8 -60 0 -44 C8 -60 22 -70 40 -70
             C62 -70 84 -52 84 -24 C84 6 60 36 0 78 Z" fill="#8B5FD0"/>
